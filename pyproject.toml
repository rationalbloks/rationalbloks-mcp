[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rationalbloks-mcp"
version = "0.11.0"
description = "RationalBloks MCP Server - Deploy production REST APIs and Neo4j Graph APIs in minutes. 45 infrastructure tools for projects, schemas, and graph data."
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    { name = "RationalBloks", email = "support@rationalbloks.com" }
]
keywords = ["mcp", "ai", "backend", "database", "api", "graph", "neo4j", "claude", "cursor", "smithery"]
mcpName = "io.github.rationalbloks/rationalbloks-mcp"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # This package targets the SDK 2.0 handler-registration API (constructor
    # callbacks); 2.0 removed the 1.x decorator API, so mcp>=2 is required, and <3
    # caps the next major so a future SDK break can't silently reach users. The same
    # major-cap guards the other API-bearing deps; certifi stays open — a
    # date-versioned CA bundle with a trivial, stable API whose updates we want.
    "mcp>=2,<3",
    "httpx>=0.27.0,<1",
    "certifi>=2024.0.0",
    "starlette>=0.41.0,<1",
    "uvicorn>=0.32.0,<1",
    "sse-starlette>=3.0.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://rationalbloks.com"
Documentation = "https://rationalbloks.com/docs/mcp"
Repository = "https://github.com/rationalbloks/rationalbloks-mcp"
Issues = "https://github.com/rationalbloks/rationalbloks-mcp/issues"

[project.scripts]
rationalbloks-mcp = "rationalbloks_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rationalbloks_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]
